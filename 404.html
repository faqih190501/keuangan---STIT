<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMPEL-IF &bull; Mengalihkan Halaman...</title>
  <meta http-equiv="refresh" content="0; URL=./index.html">
  <link rel="icon" type="image/png" href="./assets/images/logo.png">
  <link rel="stylesheet" href="./css/variables.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 32px 28px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      max-width: 420px;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="./assets/images/logo.png" alt="Logo STIT Ihsanul Fikri" class="logo">
    <h2 style="margin: 0 0 8px; font-size: 1.2rem;">SIMPEL-IF STIT Ihsanul Fikri</h2>
    <p style="margin: 0 0 16px; font-size: 0.85rem; color: #94a3b8;">Sedang mengalihkan Anda ke portal utama...</p>
    <div class="spinner"></div>
    <a href="./index.html" style="color: #38bdf8; font-size: 0.8rem; text-decoration: none; font-weight: 700;">Klik di sini jika tidak beralih otomatis ➔</a>
  </div>

  <script>
    // GitHub Pages SPA route recovery
    const segmentCount = 1;
    const l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/index.html' +
      (l.search ? l.search : '') + (l.hash ? l.hash : '')
    );
  </script>
</body>
</html>
